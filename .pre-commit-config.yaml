repos:
  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black
        language_version: "3.11"
  - repo: https://github.com/pycqa/isort
    rev: 9.0.2
    hooks:
      - id: isort
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: ["--allow-multiple-documents"]
