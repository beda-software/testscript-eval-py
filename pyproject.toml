[build-system]
requires = ["poetry-core>=2.0,<3"]
build-backend = "poetry.core.masonry.api"

[project]
name = "testscript_eval"
version = "0.0.4"
description = "TestScript FHIR resource evaluator"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["fhir"]
authors = [{ name = "beda.software", email = "ilya@beda.software" }]
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.14.5,<4",
    "fhirpathpy>=2.2.4,<3",
    "jsonpath-ng>=1.15.0,<2",
    "pytest>=9.2.0,<10",
    "pyyaml>=6.0.3,<7",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.entry-points.pytest11]
testscript-eval-py = "testscript_eval.pytest_plugin"

[tool.poetry]
packages = [{ include = "testscript_eval" }]

[tool.poetry.group.dev.dependencies]
black = "^26.10.1"
isort = "^9.0.2"
pre-commit = "^4.7.0"
pyflakes = "^4.1.0"
ipython = "^9.18.1"
epc = "^0.0.5"

[tool.black]
line-length = 100
target-version = ['py311']
exclude = '''
(
  /(
    | \.git
    | \.pytest_cache
    | htmlcov
    | locales
    | resources
    | requirements
    | embed
  )/
)
'''

[tool.isort]
profile = "black"
line_length = 100
default_section = "THIRDPARTY"
known_first_party = ["testscript_eval"]

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "-ra -q --color=yes"
testpaths = ["tests"]
log_cli = true
log_cli_level = "INFO"
